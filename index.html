<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Valencia</title>
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <div id="marker-panel">
    <div class="marker-icon" data-type="smell" draggable="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3c0 2 4 2 4 4s-4 2-4 4 4 2 4 4"/>
        <path d="M13 3c0 2 4 2 4 4s-4 2-4 4 4 2 4 4"/>
      </svg>
      <span>Smell</span>
    </div>

    <div class="marker-icon" data-type="noise-permanent" draggable="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
      <span>Permanent<br>Noise</span>
    </div>

    <div class="marker-icon" data-type="noise-temporary" draggable="true">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
      <span>Temporary<br>Noise</span>
    </div>
  </div>

  <div id="drag-ghost"></div>

  <button id="locate-btn" title="Find me">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      <circle cx="12" cy="12" r="8" stroke-opacity="0.3"/>
    </svg>
  </button>

<button id="report-btn">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    <polyline points="9 22 9 12 15 12 15 22"/>
  </svg>
  Report Property
</button>

<div id="report-sheet">
  <div id="report-sheet-inner">
    <div id="report-drag-hint">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 11.5V4a1.5 1.5 0 0 1 3 0v6.5"/>
        <path d="M12 10.5V3a1.5 1.5 0 0 1 3 0v7.5"/>
        <path d="M15 10.5V5a1.5 1.5 0 0 1 3 0v9"/>
        <path d="M6 12V9a1.5 1.5 0 0 1 3 0v6l-1.5-1.8c-.6-.7-1.7-.7-2.3 0-.5.6-.5 1.4 0 2l3.5 4.3c.9 1.1 2.3 1.7 3.7 1.7h2.1a5 5 0 0 0 5-5v-3"/>
      </svg>
      <span>Choose a type below, then <strong>drag the pin</strong> onto the building on the map</span>
    </div>
    <div class="report-option" id="report-apartment">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/>
      </svg>
      <div>
        <div class="report-option-title">Report Apartment</div>
        <div class="report-option-sub">A specific unit or flat</div>
      </div>
    </div>
    <div class="report-option" id="report-community">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <div>
        <div class="report-option-title">Report Community Area</div>
        <div class="report-option-sub">Shared spaces, yard, entrance</div>
      </div>
    </div>
  </div>
</div>

<div id="report-backdrop"></div>

<div id="rfm-overlay">
  <div id="rfm-box">
    <div class="rfm-header">
      <button id="rfm-back-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <span id="rfm-title">What's the issue?</span>
      <button id="rfm-close-btn">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <div class="rfm-progress-bar"><div id="rfm-progress-fill"></div></div>

    <div id="rfm-step-problems" class="rfm-step">
      <p id="rfm-addr-hint" class="rfm-addr-hint"></p>
      <p class="rfm-hint">Select all that apply</p>
      <div id="rfm-chips-list"></div>
      <input id="rfm-other-input" type="text" placeholder="✏️  Describe another issue…" />
    </div>

    <div id="rfm-step-floor" class="rfm-step rfm-hidden">
      <p class="rfm-hint">Which floor is the apartment on?</p>
      <input id="rfm-floor-input" type="number" min="-5" max="100" placeholder="e.g. 3" inputmode="numeric" />
    </div>

    <button id="rfm-next-btn">Continue →</button>
  </div>
</div>

<!-- Report Info Sheet -->
<div id="rinfo-overlay">
  <div id="rinfo-card">
    <div class="rinfo-top">
      <div id="rinfo-badge"></div>
      <div style="display:flex;gap:6px;align-items:center;">
        <button id="rinfo-back-btn" style="display:none;">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button id="rinfo-close-btn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- List view (multiple reports at same address) -->
    <div id="rinfo-list" style="display:none;">
      <div id="rinfo-list-address"></div>
      <div id="rinfo-list-items"></div>
    </div>

    <!-- Detail view (single report) -->
    <div id="rinfo-detail">
      <div id="rinfo-address"></div>
      <div id="rinfo-floor"></div>
      <div id="rinfo-problems"></div>
      <div id="rinfo-other"></div>
    </div>

    <button id="rinfo-delete-btn">× Delete my report</button>
  </div>
</div>

<!-- Vote Popup -->
<div id="vote-popup">
  <div id="vote-card">
    <div id="vote-type-label"></div>
    <div id="vote-address"></div>
    <input id="vote-note" type="text" maxlength="20" placeholder="Add a note…" />
    <button id="vote-note-save">Save note</button>
    <button id="vote-delete-btn" style="display:none;width:100%;margin-bottom:8px;padding:6px;border:1px solid #f5c0c3;border-radius:8px;background:#fff5f5;color:#c1121f;font-size:12px;font-family:sans-serif;cursor:pointer;opacity:0.75;">
      × Delete
    </button>
    <div id="vote-buttons">
      <button class="vote-btn" id="vote-like">
        👍 <span class="vote-count" id="vote-like-count">0</span>
      </button>
      <button class="vote-btn" id="vote-dislike">
        👎 <span class="vote-count" id="vote-dislike-count">0</span>
      </button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>

<!-- Firebase (compat — no bundler) -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>

</body>
</html>
